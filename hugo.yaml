# go-wasmcontainers documentation (Hugo + Hextra), built like go-slides/docs,
# go-ndarray/docs and go-fileshare/docs.
#
# Each documentation version is a separate build under
# https://go-wasmcontainers.github.io/docs/<version>/, where <version> is the
# minor version of go-wasmcontainers/engine the pages describe (0.1, 0.2, ...),
# or "main" while no release is tagged. The CI sets it through --baseURL, from
# params.engine.version below. This default is the same build.
baseURL: "https://go-wasmcontainers.github.io/docs/main/"
title: "go-wasmcontainers"
# themes/hextra is the tannevaled/hextra fork, pinned at a release tag
# (v0.20.0): upstream Hextra plus opt-in features (partial menu items, combos,
# related-sites menu, page subtitle and history, darkreaderLock).
theme: hextra

# One language for now. English stays at the root of each version
# (/docs/<version>/architecture/); a language is added with a `languages:`
# block the way go-slides/docs declares them, once its content exists.
defaultContentLanguage: en

enableRobotsTXT: true
# Git history dates every page: "Last updated on" at the bottom of each page.
enableGitInfo: true

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        title: true
  highlight:
    noClasses: false

module:
  hugoVersion:
    extended: false
    min: 0.146.0
  # The marks and favicons come from the go-wasmcontainers brand repository
  # (submodule branding/), published under /images/brand/. Only the org mark's
  # colour formats are mounted.
  mounts:
    - source: static
      target: static
    - source: assets
      target: assets
    - source: branding/svg/color
      target: static/images/brand/svg
      files: ["go-wasmcontainers.svg"]
    - source: branding/png/color
      target: static/images/brand/png
      files: ["*/go-wasmcontainers.png"]
    - source: branding/ico
      target: static/images/brand/ico
      files: ["go-wasmcontainers.ico"]

menu:
  main:
    # Navbar, left to right: version, theme, search, sources.
    - name: Version
      weight: 3
      params:
        type: partial
        partial: components/version-select.html
    - name: Theme
      weight: 5
      params:
        type: theme-toggle
        combo: true
    - name: Search
      weight: 6
      params:
        type: search
    - name: GitHub
      url: https://github.com/go-wasmcontainers/engine
      weight: 7
      params:
        icon: github

params:
  description: "A container engine whose containers are WASI (wasip1) modules, compatible with the Docker Engine API, in pure Go (CGO=0), with an in-browser playground for container training labs. Engine v0.27.0 is released and the playground is live."

  # The go-wasmcontainers/engine release these pages describe. Its minor
  # version is the documentation's version label (v0.1.2 -> 0.1): the CI reads
  # it here. "main" while nothing is released: the pages then describe the
  # branch being written, and say so.
  engine:
    version: "v0.27.0"
  versions:
    # The version selector shows "main" with the development icon.
    development: "main"

  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      # The cyan mark reads on both themes; the name is the site title.
      path: images/brand/svg/go-wasmcontainers.svg
      dark: images/brand/svg/go-wasmcontainers.svg
      width: 32
      height: 32
      # Related sites, opened from the chevron beside the title (the logo itself
      # leads to the documentation's home).
      menu:
        - name: go-wasmcontainers
          url: https://go-wasmcontainers.github.io/
          logo: images/brand/svg/go-wasmcontainers.svg

  theme:
    default: system
    # The theme toggle is in the navbar (menu above), not at the foot of the sidebar.
    displayToggle: false
    # Dark Reader would darken the light theme itself; with the lock, the dark
    # theme is our own.
    darkreaderLock: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  editURL:
    enable: true
    base: "https://github.com/go-wasmcontainers/docs/edit/main/content"

  toc:
    displayTags: true

  page:
    width: normal
    # The front matter description as a subtitle under the title.
    displayDescription: true
    # "Created on ... by ... · Modified on ... by ..." at the foot of each page:
    # creation from data/pagehistory.json, which the build writes with
    # the theme's cmd/pagehistory (it needs the full git history);
    # modification from git (enableGitInfo).
    history: true
    contextMenu:
      enable: false

  highlight:
    copy:
      enable: true
      display: hover

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
